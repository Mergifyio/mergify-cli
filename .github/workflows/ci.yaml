name: Continuous Integration
permissions: read-all

on:
  pull_request:
    branches:
      - main
      - devs/**

# Cancel superseded runs on the same ref — a force-push or a new
# commit makes the in-flight run obsolete, so don't keep runners
# busy finishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The published files (see AGENTS.md) come from the CLI's source, copied by
  # mergify-ci-bot as of each release: an edit made here would be silently
  # overwritten by the next sync. Only that sync's own pull requests may
  # change them.
  synced-files:
    name: synced files only change through the sync
    if: github.event.pull_request.user.login != 'mergify-ci-bot'
    timeout-minutes: 5
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Check no synced file changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "${BASE_SHA}...HEAD" -- \
            README.md install.sh skills .claude-plugin .codex-plugin assets LICENSE)"
          if [ -n "${changed}" ]; then
            for file in ${changed}; do
              echo "::error file=${file}::${file} is published from the CLI's source and synced here at each release; edit it there (see AGENTS.md)"
            done
            exit 1
          fi
          echo "no synced file changed"

  ci-gate:
    if: ${{ !cancelled() }}
    needs:
      - synced-files
    runs-on: ubuntu-26.04
    steps:
      - name: Verify all jobs succeeded
        uses: Mergifyio/gha-mergify-ci@ce0d6bef01217d90fb9e908e6966b0f6f4ea26d5 # v26
        with:
          action: wait-jobs
          jobs: ${{ toJSON(needs) }}
