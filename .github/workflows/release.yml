name: release

# Two-stage release flow, forced by GitHub's immutable-releases
# policy (assets can't be added after publish — PR #1569 dropped a
# prior `gh release upload` job for the same reason). Naïvely you'd
# expect `release: created` to fire for draft saves and let us
# attach binaries before publish, but GitHub Actions filters
# release events on drafts: nothing fires until the release becomes
# visible. So the prepare stage runs from `workflow_dispatch`
# instead — the maintainer drives it from the Actions UI.
#
# Stage 1 — prepare-draft (`workflow_dispatch`):
#   Maintainer opens Actions → "release" → "Run workflow" → enters
#   the tag (e.g. `2026.10.1`) or leaves it empty. The workflow builds the wheel
#   matrix, extracts the binary from each wheel, packages
#   `mergify-<version>-<target>.{tar.gz,zip}` + `SHA256SUMS`, dumps
#   the CLI schema to `cli-schema.json`, and creates the GitHub
#   Release as a *draft* with all assets attached and notes
#   auto-generated from the commit log via `--generate-notes`.
#
# Stage 2 — publish-stable (`release: published`):
#   Maintainer goes to Releases, reviews the draft (notes + asset
#   list), optionally edits, clicks "Publish release". This fires
#   `release: published`. We assert the expected asset names are
#   present (sanity net if the maintainer somehow stripped them
#   before publish), then build wheels again and push to PyPI.
#   The release is immutable from this point on.
#
# Yes, wheels are built twice (once per stage). Stashing them
# between two separately-triggered runs adds cross-run artifact
# plumbing for ~5 min of CI savings; not worth it. `build-wheels.yml`
# is shared with `ci.yaml` so adding a new platform target there
# extends both stages automatically.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: |
          Release tag to publish, `YYYY.M.N` (e.g. `2026.10.1`).
          Leave empty to auto-pick `YYYY.M.<next>` where `<next>` is
          one past the highest version taken this UTC month (1 if
          no release has shipped this month yet).
        required: false
        type: string
        default: ''
      target_commitish:
        description: |
          Branch or commit SHA to tag. Defaults to the branch the
          workflow runs from — keep as-is unless you're cherry-
          picking a release commit off an older line.
        required: false
        type: string
        default: ''
  release:
    types: [published]

# Every dispatch shares one group, whatever its tag: an auto run and
# an explicit one naming the version auto would pick (or two auto
# runs) could otherwise resolve the same `YYYY.M.<next>` side by
# side and race to create the same draft. Releases are rare enough
# that queueing them costs nothing. `release: published` runs key
# off their tag — the version is fixed by then. Don't
# cancel-in-progress: a release run end-to-end is the only correct
# outcome — partial completion would leave a wheel mismatch with
# the PyPI publish.
concurrency:
  group: release-${{ github.event_name == 'release' && github.event.release.tag_name || 'dispatch' }}
  cancel-in-progress: false

jobs:
  # ---------------- Stage 1: prepare draft ----------------

  compute-tag:
    name: resolve release tag
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    permissions:
      # checkout + the tag list, and the release list: GitHub only
      # lists draft releases to a token that can push, and a pending
      # draft holds its version without any tag existing yet.
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `git tag -l` needs the full tag list to find this
          # month's highest counter.
          fetch-depth: 0
          fetch-tags: true

      # Either honour an explicit `tag` input or synthesise
      # `YYYY.M.<next>` from this UTC month and the versions already
      # taken. Three components because npm only takes SemVer and
      # the CLI releases under one version with the npm, PyPI and
      # RubyGems clients. Both paths validate the final shape so a
      # typo doesn't drift through the matrix, and refuse a version
      # already taken before the builds rather than at
      # `gh release create`.
      - id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # A version is taken once a tag names it (the release was
          # published) or a release does (including a draft still
          # awaiting review, whose tag only appears on publish).
          taken="$( { git tag -l; gh api --paginate "repos/${REPO}/releases" --jq '.[].tag_name'; } | sort -u)"
          if [ -n "${INPUT_TAG}" ]; then
              tag="${INPUT_TAG}"
              echo "Using explicit tag: ${tag}"
          else
              # `%-m` drops the leading zero (`2026.9`, not
              # `2026.09`). UTC so the rollover is the same
              # regardless of which maintainer triggers the run.
              month="$(date -u +'%Y.%-m')"
              # `grep` exiting 1 on no match is the legitimate
              # "nothing shipped this month yet" path — swallow only
              # that, keeping pipefail otherwise. The anchored
              # pattern keeps the old 4-component `YYYY.M.D.N` tags
              # out of the count.
              last_n="$(echo "${taken}" \
                  | { grep -E "^${month//./\\.}\\.[0-9]+$" || true; } \
                  | awk -F. '{print $NF}' \
                  | sort -n \
                  | tail -1)"
              tag="${month}.$(( ${last_n:-0} + 1 ))"
              echo "Auto-computed tag: ${tag}"
          fi
          # Final shape check — `gh release create` would accept
          # any string, and npm would refuse a fourth component.
          if ! [[ "${tag}" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
              echo "::error::tag '${tag}' doesn't match the YYYY.M.N calver shape"
              exit 1
          fi
          if grep -qxF "${tag}" <<<"${taken}"; then
              echo "::error::${tag} is already taken by a tag or a release (a pending draft included); publish or delete it first"
              exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build-wheels-for-draft:
    name: build wheels (draft stage)
    if: github.event_name == 'workflow_dispatch'
    needs: compute-tag
    uses: ./.github/workflows/build-wheels.yml
    with:
      stamp-version: true
      override-version: ${{ needs.compute-tag.outputs.tag }}

  create-draft-release:
    name: create draft release with binaries
    if: github.event_name == 'workflow_dispatch'
    needs: [compute-tag, build-wheels-for-draft]
    runs-on: ubuntu-26.04
    permissions:
      # `gh release create` writes the release.
      contents: write
      # actions/attest-build-provenance mints a signed provenance for
      # each binary asset (id-token to sign, attestations to record).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `--generate-notes` needs full history to walk back to
          # the previous tag.
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          path: artifacts

      # Each `wheel-<target>` artifact is a maturin-built wheel with
      # the `mergify` binary at `<dist>.data/scripts/mergify[.exe]`.
      # Extract it, normalise into
      # `mergify-<version>-<target>.{tar.gz,zip}`, then hash the lot
      # with sha256 so the installer can verify what it pulled.
      # Embedding the version (before the Rust triple) lets
      # Homebrew's dotted-version parser win over the fallback stem
      # regex that would otherwise mangle `x86_64` assets.
      - name: Extract binaries and repack
        env:
          INPUT_TAG: ${{ needs.compute-tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for dir in artifacts/wheel-*; do
            target="${dir#artifacts/wheel-}"
            # The musllinux wheels exist for `pip install` on Alpine;
            # the release binaries stay the glibc set that
            # `install.sh`, `self-update` and the asset assertion
            # below expect.
            if [[ "${target}" == *-musl ]]; then
              continue
            fi
            whl=$(ls "${dir}"/*.whl | head -1)
            workdir=$(mktemp -d)
            # Pick the binary name up-front from the target — every
            # wheel ships exactly one of `mergify` or `mergify.exe`,
            # never both. Passing *both* patterns to `unzip` made it
            # exit 11 ("no matching files") for whichever pattern
            # didn't apply, even when the other one did extract,
            # killing the script under `set -e`.
            if [[ "${target}" == *windows* ]]; then
              bin=mergify.exe
            else
              bin=mergify
            fi
            # `-joq` is the combined form of `-j -o -q`: junk paths
            # (flatten), overwrite without prompting, quiet. The
            # wheel layout is `<dist>.data/scripts/<bin>`; we only
            # want `<bin>` extracted at the workdir root.
            unzip -joq "${whl}" "*/scripts/${bin}" -d "${workdir}"
            if [[ "${target}" == *windows* ]]; then
              (cd "${workdir}" && zip -q "${OLDPWD}/dist/mergify-${INPUT_TAG}-${target}.zip" "${bin}")
            else
              chmod +x "${workdir}/${bin}"
              tar -C "${workdir}" -czf "dist/mergify-${INPUT_TAG}-${target}.tar.gz" "${bin}"
            fi
            rm -rf "${workdir}"
          done
          (cd dist && sha256sum mergify-* > SHA256SUMS)
          echo "Built release assets:"
          ls -la dist

      # Sign every binary asset with a build-provenance attestation,
      # so a downloader can prove it was built by this workflow from
      # this repo: `gh attestation verify <file> --repo Mergifyio/mergify-cli`.
      # SHA256SUMS already chains integrity to these subjects, so it
      # needs no separate attestation.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/mergify-*

      # Dump the CLI schema straight off the released binary so the
      # docs site renders the command reference from the same artifact
      # it ships — it can't drift from the binary. The x86_64 Linux
      # wheel's binary runs natively on the ubuntu-26.04 runner. Stable
      # filename (the version is carried inside, under `cli.version`)
      # so docs tooling can fetch it off the latest release without
      # resolving the tag. Not added to SHA256SUMS — that file is the
      # installer's binary-integrity manifest, not a docs artifact.
      - name: Dump CLI schema
        shell: bash
        run: |
          set -euo pipefail
          whl=$(ls artifacts/wheel-x86_64-unknown-linux-gnu/*.whl | head -1)
          workdir=$(mktemp -d)
          unzip -joq "${whl}" "*/scripts/mergify" -d "${workdir}"
          chmod +x "${workdir}/mergify"
          "${workdir}/mergify" _internal dump-cli-schema > dist/cli-schema.json
          rm -rf "${workdir}"
          echo "Wrote dist/cli-schema.json ($(wc -c < dist/cli-schema.json) bytes)"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Read inputs via env, not `${{ }}` interpolation, so a
          # tag or commitish value containing shell metacharacters
          # can't break out of the script. With direct
          # interpolation, `inputs.tag = "foo'; rm -rf /; '"` would
          # render the script as runnable injected commands;
          # through env they reach bash as plain string values.
          INPUT_TAG: ${{ needs.compute-tag.outputs.tag }}
          INPUT_TARGET: ${{ inputs.target_commitish }}
        shell: bash
        run: |
          set -euo pipefail
          # Build the gh argument list as an array — keeps each
          # element a single argv slot regardless of the value's
          # contents.
          args=(
              "${INPUT_TAG}"
              --draft
              --generate-notes
              --title "${INPUT_TAG}"
          )
          if [ -n "${INPUT_TARGET}" ]; then
              args+=(--target "${INPUT_TARGET}")
          fi
          # `--draft` keeps the release mutable until the maintainer
          # clicks Publish. `--generate-notes` builds a changelog
          # from PRs merged since the previous tag — overridable in
          # the UI before publish if needed.
          gh release create "${args[@]}" dist/*

          url=$(gh release view "${INPUT_TAG}" --json url --jq .url)
          echo
          echo "Draft release created: ${url}"
          echo "Review the draft and click Publish in the Releases UI to ship."

  # ---------------- Stage 2: publish + PyPI ----------------
  #
  # Every stage-2 job skips releases authored by mergify-ci-bot. Those are
  # the test clients' releases (pytest-mergify, rspec-mergify, @mergifyio/*),
  # which their now-private repository publishes itself and ci-bot mirrors
  # here so their notes and files stay public. They carry no CLI binaries and
  # must not reach PyPI as mergify-cli; without the skip, every mirror would
  # fail the asset check below. A release created with a user token starts
  # workflows, unlike one created with GITHUB_TOKEN, hence the check on the
  # author rather than on how it was created.

  assert-binaries-present:
    name: assert binary assets attached
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.author.login != 'mergify-ci-bot'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Check expected assets are on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.release.tag_name }}"
          mapfile -t attached < <(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "Assets on $tag:"
          printf '  %s\n' "${attached[@]}"

          expected=(
            "mergify-${tag}-x86_64-unknown-linux-gnu.tar.gz"
            "mergify-${tag}-aarch64-unknown-linux-gnu.tar.gz"
            "mergify-${tag}-x86_64-apple-darwin.tar.gz"
            "mergify-${tag}-aarch64-apple-darwin.tar.gz"
            "mergify-${tag}-x86_64-pc-windows-msvc.zip"
            SHA256SUMS
            cli-schema.json
          )
          missing=()
          for asset in "${expected[@]}"; do
            printf '%s\n' "${attached[@]}" | grep -qxF "$asset" || missing+=("$asset")
          done
          if (( ${#missing[@]} > 0 )); then
            cat <<EOF >&2
          ::error::Release $tag is missing assets: ${missing[*]}

          Binary assets are attached by the 'create-draft-release' job, which
          runs from Actions → "release" → "Run workflow". Did you create this
          release through the Releases UI directly instead? That path doesn't
          attach binaries, and the release is now immutable so they can't be
          backfilled — the PyPI publish is being blocked so the package and the
          binary distributions don't diverge.

          Recovery: delete this release, then re-create it via Actions →
          "release" → "Run workflow" with the same tag.
          EOF
            exit 1
          fi
          echo "All expected assets present — proceeding."

  build-wheels-for-publish:
    name: build wheels (publish stage)
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.author.login != 'mergify-ci-bot'
    needs: assert-binaries-present
    uses: ./.github/workflows/build-wheels.yml
    with:
      stamp-version: true

  publish:
    name: publish to PyPI
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.author.login != 'mergify-ci-bot'
    runs-on: ubuntu-26.04
    needs:
      - assert-binaries-present
      - build-wheels-for-publish
    environment: release
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist

      # Everything in `dist` goes to PyPI, so this is the last place
      # to stop an sdist: maturin vendors the whole workspace into
      # one, and uploading it would publish the full CLI source.
      # Anything but a wheel fails the job before the upload.
      - name: Check only wheels are collected
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist
          mapfile -t others < <(find dist -type f ! -name '*.whl' -printf '%f\n')
          if (( ${#others[@]} > 0 )); then
            echo "::error::refusing to publish non-wheel files: ${others[*]}"
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          # Mint PEP 740 attestations for the wheels via the
          # same Trusted Publishing identity (id-token: write above).
          attestations: true
